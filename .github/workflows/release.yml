name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: |
          cd packages/kashkool_core
          flutter pub get
          cd ../../apps/kashkool_app
          flutter pub get
          cd ../kashkool_admin
          flutter pub get

      - name: Generate code
        working-directory: apps/kashkool_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build client APKs (split per ABI)
        working-directory: apps/kashkool_app
        run: flutter build apk --split-per-abi --release

      - name: Build admin APK
        working-directory: apps/kashkool_admin
        run: flutter build apk --release

      - name: Build Windows desktop
        working-directory: apps/kashkool_app
        run: flutter build windows --release

      - name: Build web release
        working-directory: apps/kashkool_app
        run: flutter build web --release

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/kashkool_app/build/app/outputs/flutter-apk/*.apk
            apps/kashkool_admin/build/app/outputs/flutter-apk/*.apk
            apps/kashkool_app/build/windows/runner/Release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
