name: Kashkool CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Shared core package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kashkool_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test

  apps:
    name: App ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - kashkool_app
          - kashkool_admin
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate code
        if: matrix.app == 'kashkool_app'
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory yet - nothing to run."
          fi
      - name: Debug APK build
        run: flutter build apk --debug

  edge-functions:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all functions
        run: deno task check
      - name: Catalog and pricing tests
        run: deno task test

  database:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL grammar validator
        run: pip install pglast==8.9
      - name: Parse every migration with the PostgreSQL grammar
        run: python supabase/validate_sql.py

  knowledge-gate:
    name: Savior Knowledge Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Savior Engine
        run: |
          cd ${{ github.workspace }}
          git clone https://github.com/kashkool/savior-engine.git .savior-engine || true
          cd .savior-engine && npm install && npx tsc --project tsconfig.knowledge.json
      - name: Run Knowledge Checks
        run: |
          cd ${{ github.workspace }}
          node .savior-engine/cli/knowledge.mjs check:project
