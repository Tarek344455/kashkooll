name: Supabase Database Gate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-migrations:
    name: Migrations + RLS on a real local Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Boot local Supabase stack
        run: supabase start
      - name: Apply all migrations and seed.sql from scratch
        run: supabase db reset
      - name: Run pgTAP security tests
        run: supabase test db
      - name: Stop local stack
        if: always()
        run: supabase stop
