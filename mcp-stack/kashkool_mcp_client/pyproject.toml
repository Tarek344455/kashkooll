[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kashkool-mcp-client"
version = "1.0.0"
description = "Cognitive MCP Architecture - Reasoning, Memory, Creativity, Verification for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kashkool Team", email = "team@kashkool.dev"}
]
keywords = [
    "mcp", "model-context-protocol", "cognitive", "reasoning", "memory",
    "creativity", "verification", "ai", "llm", "agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sse-starlette>=2.1.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "msgpack>=1.0.7",
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "black>=23.11.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]
playwright = ["playwright>=1.40.0"]
firecrawl = ["firecrawl-py>=0.1.0"]
jina = ["jina-py>=0.1.0"]
all = [
    "playwright>=1.40.0",
    "firecrawl-py>=0.1.0",
    "jina-py>=0.1.0",
]

[project.scripts]
kashkool-mcp = "kashkool_mcp_client.cli:cli"
kashkool-mcp-server = "kashkool_mcp_client.api_server:main"
kashkool-mcp-demo = "kashkool_mcp_client.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "QF", "RSE", "RET", "SLF", "SLOT", "TRY", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "TCH", "INT", "ASYNC", "LOG", "PERF", "AIR", "C90", "ISC", "ICN", "PT", "QF", "RSE", "RET", "SLF", "SLOT", "TRY", "ARG", "PTH", "ERA", "PD", "PGH", "PL"
]
ignore = ["E501", "B008"]
exclude = ["tests/", ".venv/", "dist/", "build/"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = "\\.venv|dist|build"

[tool.coverage.run]
source = ["kashkool_mcp_client"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

